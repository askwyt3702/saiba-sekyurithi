services:
  db:
    image: postgres:16-alpine
    container_name: mystery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: detective
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: cyber_mystery
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: mystery_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://detective:secretpassword@db:5432/cyber_mystery
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: mystery_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
