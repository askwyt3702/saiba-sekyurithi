name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # backend/game_data.py・balance_config.py を変えたのに stageData.ts を生成し直していないと失敗する。
  # 失敗したら、リポジトリのルートで `python scripts/gen_stage_data.py` を実行してコミットし直すこと。
  stage-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/gen_stage_data.py
      - run: git diff --ignore-cr-at-eol --exit-code -- frontend/src/game/data/stageData.ts

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: detective
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: cyber_mystery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://detective:secretpassword@localhost:5432/cyber_mystery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      # 実際にPostgreSQLに接続してアプリを起動時まで通すことで、
      # importのtypoやモデル定義ミスなど「起動して初めて分かる」不具合を検知する。
      - run: python -c "import main"
      # ゲームルールのテスト(backend/tests)。テスト自体は使い捨てのSQLiteで動くので、DBの状態に依存しない。
      - run: pytest
